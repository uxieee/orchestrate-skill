<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Conductor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Cocoa palette: cream #FFF8F0, caramel #C08552, brown #8C5A3C, espresso #4B2E2B */
  --bg:#fff8f0;--sf:#fffdf9;--sel:#fbf1e4;--col:#f6ebdd;--ink:#4b2e2b;--mute:#65402d;--line:#eddfd0;--soft:#f7ede1;--seg:#ebdccb;
  --cream:#fff8f0;--caramel:#c08552;
  --ac:#8c5a3c;--ac-d:#774a30;
  --ok:#2f9e6b;--ok-t:#dff0e5;--ok-x:#1b5e3c;--ok-m:#b9ddc9;
  --pg:#a8683a;--pg-t:#f4e3d0;--pg-x:#5e3210;--line2:#dcc6b0;
  --warn:#d9941a;--warn-t:#fbe6b0;--warn-x:#573700;--warn-w:#fff6df;
  --bd:#c23b30;--bd-t:#fbe1dc;--bd-x:#8e1f18;--bd-w:#fff3f0;
  --out:cubic-bezier(.16,1,.3,1);
  --shadow:0 1px 2px rgba(75,46,43,.07),0 1px 8px -2px rgba(75,46,43,.06);
  --lift:0 10px 30px -8px rgba(75,46,43,.28),0 2px 6px rgba(75,46,43,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;background:var(--bg);font:400 14px/20px Figtree,-apple-system,"Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;accent-color:var(--ac);caret-color:var(--ac)}
::selection{background:#ecd0b3;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px;box-shadow:0 0 0 5px var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{scrollbar-width:thin;scrollbar-color:#d9c6b0 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9c6b0;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.id,.tab,.pct,.n,.cnt{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}

/* ---------- shell ---------- */
aside.side{width:216px;flex:none;height:100vh;position:sticky;top:0;padding:24px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 24px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{position:relative;display:flex;align-items:center;gap:12px;height:36px;padding:0 8px;border-radius:8px;color:var(--mute);font-weight:500;width:100%;transition:background .15s,color .15s}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav.on{background:var(--soft);color:var(--ink);font-weight:600}
.nav b{margin-left:auto;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--ink);border-radius:10px;min-width:22px;height:20px;padding:0 6px;font-size:13px;font-weight:700;text-align:center;line-height:20px;font-variant-numeric:tabular-nums}
.nav b[hidden]{display:none}
.nav b.bump{animation:bump .5s var(--out)}
.demo{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px}
.demo .dlab{font-size:13px;color:var(--mute);font-weight:600;padding:0 8px;margin-bottom:2px}
.demo button{height:32px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:600;font-size:13px;color:var(--ink);transition:background .15s}
.demo button:hover{background:var(--soft)}
.demo button svg{width:14px;height:14px}
.demo kbd{margin-left:auto;font:600 13px/16px Figtree,sans-serif;color:var(--mute);border-radius:4px;padding:0 6px;background:var(--soft)}
.foot{display:flex;align-items:center;gap:8px;padding:12px 8px 0;color:var(--mute);font-size:13px}
.foot .a{margin:0;border-color:var(--bg)}
.mob-only{display:none}

main{flex:1;min-width:0;height:100vh;padding:28px 40px 0;display:flex;flex-direction:column;overflow-y:auto}
.top{display:flex;align-items:baseline;min-height:44px;flex:none;gap:0}
h1{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.025em}
.top .sub{color:var(--mute);margin-left:16px;font-size:16px}
.btn{height:36px;padding:0 16px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .12s var(--out),background .15s,box-shadow .15s}
.btn.pr{background:var(--ac);color:var(--cream)}
.btn.pr:hover{background:var(--ac-d)}
.btn.gh{background:var(--soft)}
.btn.gh:hover{background:var(--col)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.top .btn{margin-left:auto;align-self:center}

/* ---------- project rows ---------- */
.tbl{margin-top:20px;flex:none}
.row{display:grid;grid-template-columns:minmax(200px,1fr) minmax(160px,1.3fr) 88px 156px 164px;gap:20px;align-items:center;padding:0 20px;border-radius:12px;height:72px;position:relative;cursor:pointer;transition:background .2s}
.row:not(.th):hover{background:var(--soft)}
.th{height:32px;font-size:13px;font-weight:600;color:var(--mute);cursor:default}
.th>span:nth-child(3){text-align:right}
.row.sel{background:var(--sf);box-shadow:var(--shadow)}
.row.sel::before{content:"";position:absolute;left:5px;top:20px;bottom:20px;width:3px;border-radius:2px;background:var(--ac);animation:grow-y .3s var(--out) both}
.name{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;min-width:0}
.name>div{min-width:0}
.name .chev{width:16px;height:16px;color:var(--mute);flex:none;transition:transform .25s var(--out)}
.row.sel .chev{transform:rotate(90deg);color:var(--ink)}
.name a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px}
.name small{display:block;font-weight:400;font-size:14px;line-height:20px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;gap:3px}
.bar i{flex:1;height:12px;border-radius:3px;background:var(--seg);transform-origin:left center;min-width:0}
.bar i.g-d{background:var(--ok)}
.bar i.g-w{background:var(--pg)}
.bar i.g-q{background:repeating-linear-gradient(135deg,var(--pg) 0 3px,#e3c3a2 3px 6px)}
.bar i.g-f{background:var(--bd)}
.bar i.new{animation:pop .6s var(--out)}
.pct{text-align:right;font-weight:700;font-size:28px;line-height:32px;letter-spacing:-.02em}
.st{height:24px;padding:0 12px 0 10px;border-radius:12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:100%;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-ok{color:var(--ink)}
.s-wait{color:var(--warn-x);background:var(--warn-t)}
.s-ok,.s-done,.s-near{background:none;padding-left:0}
.s-ok::before{background:var(--pg)}
.s-done::before{background:var(--ok)}
.s-near{color:var(--mute)}
.s-done{color:var(--ok-x)}
.avs{display:flex;align-items:center}

/* avatars */
.ab{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-left:-6px;flex:none;transition:transform .15s var(--out)}
.ab:first-child{margin-left:0}
.ab:hover{transform:translateY(-2px);z-index:2}
.a,.av{position:relative;border-radius:50%;background:var(--col);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.a{width:28px;height:28px;border:2px solid var(--sf)}
.sel .a{border-color:var(--sel)}
.row:hover .a{border-color:var(--sel)}
.av{width:24px;height:24px}
.a.lg{width:44px;height:44px;font-size:16px;border:0}
.a.md{width:32px;height:32px;border:0}
.dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--sf);background:var(--mute)}
.sel .a .dot{border-color:var(--sel)}
.lg .dot{width:14px;height:14px;right:-2px;bottom:-2px;border-width:3px}
.dot.working{background:var(--pg)}
.dot.quiet{background:var(--warn);border-radius:2px;transform:rotate(45deg)}
.dot.idle{background:var(--sf);box-shadow:inset 0 0 0 2px var(--mute)}
.dot.gone{background:linear-gradient(var(--sf),var(--sf)) center/4px 1.5px no-repeat,var(--mute)}
.st-gone{box-shadow:0 0 0 1px var(--mute);background:repeating-linear-gradient(135deg,var(--soft) 0 3px,#e6d6c4 3px 5px)}
.dot.working::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--pg);opacity:0;animation:ping 4.4s var(--out) infinite}
.av.none{background:none;box-shadow:none;border:1px dashed var(--mute)}
.a.amore{background:var(--sf);box-shadow:inset 0 0 0 1px var(--line2);font-size:12px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.ab:hover .a.amore{box-shadow:inset 0 0 0 1.5px var(--ac)}

/* ---------- board ---------- */
.bh{display:flex;align-items:center;gap:12px;margin-top:32px;min-height:36px;flex:none;flex-wrap:wrap}
h2{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.015em}
.bh .sub{color:var(--mute)}
.lnk{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--caramel);text-decoration-thickness:2px;text-underline-offset:3px;border-radius:2px;transition:text-decoration-color .15s}
.lnk:hover{text-decoration-color:var(--ac)}
.stage{flex:1;margin-top:8px;display:flex;min-height:340px}
.board{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;min-height:0;min-width:0}
.col{background:var(--col);border-radius:16px 16px 0 0;padding:16px 12px 0;display:flex;flex-direction:column;min-height:0;min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:0 4px 12px;font-weight:600;flex:none}
.ch svg{flex:none}
.ch .n{margin-left:auto;color:var(--mute);font-weight:600;font-size:13px}
.cl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:0 -12px;padding:2px 12px 24px}
.card{background:var(--sf);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;flex:none;transition:transform .2s var(--out),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -6px rgba(75,46,43,.24),var(--shadow)}
.card.sel{box-shadow:0 0 0 2px var(--ac)}
.card h3{font-size:14px;line-height:20px;font-weight:600}
.card p{font-size:14px;line-height:20px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.meta .av{margin-left:auto}
/* chips are outlined on white, never filled: text always sits on a plain surface */
.chip{height:22px;padding:0 10px;border-radius:11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);white-space:nowrap}
.c-w{color:var(--warn-x);box-shadow:inset 0 0 0 1.5px var(--warn)}
.c-b{color:var(--bd-x);box-shadow:inset 0 0 0 1.5px var(--bd)}
.card.wait{box-shadow:0 0 0 1.5px var(--warn),var(--shadow)}
.card.fail{box-shadow:0 0 0 1.5px var(--bd),var(--shadow)}
.card.wait:hover,.card.fail:hover{box-shadow:0 8px 18px -6px rgba(75,46,43,.24)}
.card.dn h3{text-decoration:line-through;text-decoration-color:#b79a82;color:var(--mute);font-weight:500}
.card.landed{animation:landed 1.4s var(--out)}
.note{color:var(--mute);font-size:14px;padding:12px 4px}
.more{color:var(--mute);font-size:13px;font-weight:600;padding:0 4px;min-height:32px;display:flex;align-items:center;border-radius:6px;flex:none;transition:color .15s}
.more:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(75,46,43,.32);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:408px;max-width:100%;background:var(--bg);box-shadow:var(--lift);z-index:40;display:flex;flex-direction:column;transform:translateX(24px);opacity:0;visibility:hidden;transition:transform .26s var(--out),opacity .2s,visibility 0s .26s}
.drawer.open{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.dh{display:flex;align-items:center;gap:8px;padding:16px 16px 0 24px;min-height:56px;flex:none}
.dh .grow{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.x{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute);transition:background .15s,color .15s;flex:none}
.x:hover{background:var(--soft);color:var(--ink)}
.x svg{width:18px;height:18px}
.db{padding:8px 24px 32px;overflow-y:auto;flex:1}
.db h2{font-size:24px;line-height:32px;letter-spacing:-.02em;margin-bottom:16px}
.db h4{font-size:14px;font-weight:600;color:var(--ink);margin:28px 0 8px}
.dl{display:grid;grid-template-columns:96px 1fr;gap:12px 8px;align-items:center}
.dl dt{color:var(--mute);font-size:13px;font-weight:600}
.dl dd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.dl dd.col1{flex-direction:column;align-items:stretch;gap:4px}
.dash{color:var(--mute)}
.tp{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 8px;border-radius:8px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;font-weight:600;max-width:100%;transition:background .15s,box-shadow .15s}
.tp:hover{box-shadow:inset 0 0 0 1px var(--ac);background:var(--sf)}
.tp .tn{font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tp svg{width:16px;height:16px;flex:none}
.tp.big{min-height:48px;width:100%;padding:0 12px}
.tp.big .r{margin-left:auto;font-weight:500;color:var(--mute)}
.qa{border-radius:12px;padding:12px 16px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;line-height:20px;margin-top:8px}
.qa.ok{box-shadow:inset 0 0 0 1.5px var(--ok)}
.qa.pg{box-shadow:inset 0 0 0 1.5px var(--pg)}
.qa.bad{box-shadow:inset 0 0 0 1.5px var(--bd)}
.qa.warn{box-shadow:inset 0 0 0 1.5px var(--warn)}
.qa b{display:block;font-size:14px;margin-bottom:4px}
.sline{display:flex;align-items:center;gap:12px;padding:12px 0 20px}
.sline .t{font-size:13px;color:var(--mute)}
.sline .t b{display:block;font-size:18px;color:var(--ink);line-height:24px}
.w{border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px;background:var(--sf);box-shadow:var(--shadow);transition:background .2s,border-color .2s}
.w.hl{box-shadow:0 0 0 2px var(--ac)}
.w.dn{box-shadow:inset 0 0 0 1px var(--line2)}
.w-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:500}
.w-top .chip{margin-right:0}
.w-top .age{margin-left:auto;font-variant-numeric:tabular-nums}
.w h3{font-size:16px;line-height:24px;font-weight:600}
.w .det{color:var(--mute)}
.rec{background:var(--sf);box-shadow:inset 0 0 0 1px var(--line2);border-radius:8px;padding:12px;font-size:14px}
.rec b{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:40px;padding:8px 12px;border-radius:8px;box-shadow:inset 0 0 0 1px #dcc6b0;display:flex;align-items:center;gap:8px;font-weight:500;transition:box-shadow .15s,background .15s}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--ac);background:var(--sel)}
.hold{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mute);font-weight:600}
.hold .hd{flex:1 0 100%}
.hold .tp{min-height:32px;padding:0 12px}
.ans{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.ans svg{width:18px;height:18px;flex:none}
.ans .btn{margin-left:auto}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 8px;border-radius:8px;transition:background .15s}
.srow:hover{background:var(--soft)}
.srow .tx{min-width:0;flex:1}
.srow .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tx span{display:block;font-size:14px;color:var(--mute)}
.srow .r{font-size:13px;color:var(--mute);font-weight:600}

/* ---------- states ---------- */
.state{margin-top:20px;background:var(--sf);box-shadow:var(--shadow);border-radius:16px;padding:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.state .ico{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.state .ico svg{width:22px;height:22px}
.state .ico.bad{background:var(--bd-t);color:var(--bd-x)}
.state .grow{flex:1;min-width:200px}
.state h2{font-size:16px}
.state p{color:var(--mute)}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--soft) 0 40%,#fffaf3 50%,var(--soft) 60% 100%);background-size:250% 100%;animation:shim 1.4s linear infinite}
.row.skr{cursor:default;pointer-events:none}
.card.skc{pointer-events:none;height:64px}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--cream);font-size:13px;line-height:16px;font-weight:500;padding:6px 10px;border-radius:6px;max-width:260px;white-space:pre-line;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes seg{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes pop{0%{transform:scaleY(1)}30%{transform:scaleY(1.9)}100%{transform:scaleY(1)}}
@keyframes ping{0%{transform:scale(.9);opacity:.6}20%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}
@keyframes landed{0%{box-shadow:0 0 0 0 rgba(168,104,58,.7)}60%{box-shadow:0 0 0 7px rgba(168,104,58,0)}100%{box-shadow:var(--shadow)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .3s var(--out) calc(var(--d,0)*1ms) both}
.segin{animation:seg .3s var(--out) calc(var(--d,0)*1ms + var(--k,0)*10ms) both}
.fadein{animation:fade .25s var(--out) both}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  aside.side{width:64px;padding:20px 8px;align-items:center}
  .brand{padding:0 0 24px}.brand span{display:none}
  .nav{width:44px;height:44px;justify-content:center;padding:0}
  .nav span.l{display:none}
  .nav b{position:absolute;top:2px;right:0;min-width:18px;height:18px;line-height:18px;padding:0 4px;margin:0;font-size:13px}
  .demo{padding:4px;background:none;align-items:center}
  .demo .dlab,.demo button span,.demo kbd{display:none}
  .demo button{width:44px;height:44px;justify-content:center;padding:0;background:var(--soft)}
  .demo button svg{width:18px;height:18px}
  .foot{padding:12px 0 0}.foot span.tx{display:none}
  main{padding:20px 24px 0}
  .row{grid-template-columns:minmax(150px,1fr) minmax(100px,1fr) 76px 148px 128px;gap:12px}
}
@media (max-width:860px){
  .row{grid-template-columns:minmax(140px,1fr) minmax(80px,1fr) 72px 0 120px}
  .row>:nth-child(4){display:none}
  .board{gap:12px}
}
@media (max-width:720px){
  html,body{height:auto}
  body{flex-direction:column;overflow-x:hidden}

    else if (e.key === "Home" || e.key === "End") { e.preventDefault(); items[e.key === "Home" ? 0 : items.length - 1].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "Tab") { closeMenu(true); e.preventDefault(); }
  });

  function showToast(text, undoPid) {
    clearTimeout(toastT); toastPid = undoPid; toastTx.textContent = text;
    toastEl.querySelector(".btn").hidden = !undoPid; toastEl.hidden = false;
    armToast();
  }
  function armToast() { clearTimeout(toastT); toastT = setTimeout(function () { if (toastHold) return; hideToast(true); }, toastPid ? 8000 : 4000); }
  function hideToast(moveFocus) {
    clearTimeout(toastT); var had = toastEl.contains(document.activeElement);
    toastEl.hidden = true; toastPid = null; toastHold = false;
    if (had && moveFocus) focusLater(".mbtn", "h1");
  }
  toastEl.addEventListener("mouseenter", function () { toastHold = true; clearTimeout(toastT); });
  toastEl.addEventListener("mouseleave", function () { toastHold = false; armToast(); });
  toastEl.addEventListener("focusin", function () { toastHold = true; clearTimeout(toastT); });
  toastEl.addEventListener("focusout", function (e) { if (!toastEl.contains(e.relatedTarget)) { toastHold = false; if (!toastEl.hidden) armToast(); } });

  function archiveNow(id) {
    var n = nameOf(id);
    projAction(id, "archive");
    showToast("Archived.", id); say(n + " archived. Undo is available");
    var u = toastEl.querySelector(".btn"); if (u) u.focus({ preventScroll: true });
  }
  function askRemove(id, back) {
    rmPid = id; rmBack = back || null;
    rmDlg.setAttribute("data-p", id);
    $("rmt").textContent = "Remove " + nameOf(id) + " from Conductor?";
    rmDlg.showModal();
    var c = rmDlg.querySelector('[data-act="dlgcancel"]'); if (c) c.focus();
  }
  rmDlg.addEventListener("close", function () {
    if (rmPid && rmBack) { var el = rmBack.isConnected ? rmBack : document.querySelector('[data-act="premove"][data-p="' + rmPid + '"]') || menuBtn(rmPid); if (el) el.focus(); }
    rmPid = null; rmBack = null;
  });
  rmDlg.addEventListener("click", function (e) {                 /* click on the backdrop cancels */
    if (e.target !== rmDlg) return;
    var r = rmDlg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) rmDlg.close();
  });

  function plainProjErr(status, msg) {
    msg = String(msg || "");
    if (status === 403) return "Conductor only takes changes from its own window. Reopen the app and try again.";
    if (status === 404) return "Conductor no longer lists this project.";
    if (/couldn't update/i.test(msg)) return "Couldn't update the project list, so nothing changed. Try again.";
    return msg ? "Nothing changed: " + msg + "." : "Nothing changed. Try again.";
  }
  function relist() { split(); render(false, false); if (S.drawer) paintDrawer(false); }
  function projAction(id, action) {
    var mine = { act: action, inflight: true, okAt: Infinity, at: new Date().toISOString() };
    if (OV[id]) OV[id].dead = true;                              /* a newer action (Undo) replaces this one */
    var rt = route(), hash0 = location.hash, wasSel = S.pid === id;
    if (action !== "unarchive" && rt.page === "p" && rt.id === id) history.replaceState(null, "", location.pathname + location.search + "#/projects");
    OV[id] = mine; delete S.perr[id]; relist();
    function fail(msg) {
      if (mine.dead) return;
      delete OV[id]; S.perr[id] = msg; split();
      if (wasSel && proj(id)) { S.pid = id; if (location.hash !== hash0 && route().page === "projects") history.replaceState(null, "", location.pathname + location.search + hash0); }
      if (ARCH.concat(ARCHE).some(function (x) { return x.id === id; })) S.archOpen = true;
      if (toastPid === id) hideToast(false);
      render(false, false); if (S.drawer) paintDrawer(false); say(msg);
    }
    fetch("/api/project", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: id, action: action }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, ok: r.ok && !!j.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { fail(plainProjErr(res.status, res.j && res.j.error)); return; }
        if (OV[id] === mine) { mine.inflight = false; mine.okAt = Date.now(); }
        poll();
      })
      .catch(function () { fail("Could not reach Conductor's server, so nothing changed. Try again."); });
  }
  document.addEventListener("submit", function (e) { var f = e.target.closest && e.target.closest("form.free"); if (!f) return; e.preventDefault(); var i = f.querySelector("input"); sendAnswer(f.getAttribute("data-w"), i ? i.value : ""); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { var ko = document.querySelector(".key[open]"); if (ko) { ko.removeAttribute("open"); ko.querySelector("summary").focus(); return; } }
    if (e.key === "Escape" && S.drawer) { e.preventDefault(); closeDrawer(); return; }
    var t = e.target;
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("card")) { e.preventDefault(); t.click(); return; }
    if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("row") && t.getAttribute("data-go")) { e.preventDefault(); location.hash = hashFor(t.getAttribute("data-go")); return; }
    if (!LIVE && (e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || "")) demoStep();
    if (e.key === "Tab" && S.drawer && drawerEl.classList.contains("open") && drawerEl.contains(t)) {                   /* keep Tab inside an open drawer */
      var f = drawerEl.querySelectorAll("button:not([disabled]),a[href],input:not([disabled])"); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && t === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && t === last) { e.preventDefault(); first.focus(); }
    }
  });
  /* hovering a question lights the cards it holds up */
  document.addEventListener("mouseover", function (e) { var d = e.target.closest && e.target.closest("[data-wid]"); if (d) lightHeld(d.getAttribute("data-wid")); });
  document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest("[data-wid]") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-wid]"))) lightHeld(null); });
  function lightHeld(wid) {
    Array.prototype.forEach.call(stageEl.querySelectorAll(".card.hl"), function (c) { c.classList.remove("hl"); });
    if (!wid) return;
    var w = C.waiting.filter(function (x) { return x.id === wid; })[0]; if (!w) return;
    w.blocks.forEach(function (id) { var c = stageEl.querySelector('.card[data-p="' + CSS.escape(w.project) + '"][data-id="' + CSS.escape(id) + '"]'); if (c) c.style.boxShadow = "0 0 0 2px var(--warn)"; setTimeout(function () { if (c) c.style.boxShadow = ""; }, 900); });
  }

  /* ---------- tooltip ---------- */
  function hideTip() { tipEl.classList.remove("on"); }
  function showTip(el) {
    var t = el.getAttribute("data-tip"); if (!t) return;
    tipEl.textContent = t; tipEl.classList.add("on");
    var r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)), y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  }
  document.addEventListener("mouseover", function (e) { var el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el); });
  document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest("[data-tip]")) hideTip(); });
  document.addEventListener("focusin", function (e) { var el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, true);


  /* ---------- live: poll /api/state every 5 s while the tab is visible ---------- */
  var timer = null, inflight = false;
  function colOf(t) { for (var i = 0; i < COLS.length; i++) if (COLS[i].test(t)) return COLS[i].id; return ""; }
  function colMap() { var o = {}; projects.forEach(function (p) { p.tasks.forEach(function (t) { o[p.id + "/" + t.id] = colOf(t); }); }); return o; }
  function pidsKey() { return projects.map(function (p) { return p.id; }).join("|"); }
  function schedule() { clearTimeout(timer); timer = document.hidden ? null : setTimeout(poll, POLL); }
  function poll() {
    if (inflight) return; inflight = true; clearTimeout(timer);
    var ctl = window.AbortController ? new AbortController() : null, kill = setTimeout(function () { if (ctl) ctl.abort(); }, 4000), t0 = Date.now();
    fetch("/api/state", { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (api) { clearTimeout(kill); inflight = false; apply(api, t0); schedule(); })
      .catch(function () { clearTimeout(kill); inflight = false; down(); schedule(); });
  }
  function apply(api, t0) {
    var was = MODE, oldCols = colMap(), oldKey = pidsKey(), oldOpen = waitingOpen().length;
    var before = !was && projects.length ? rects() : null;
    C = adapt(api); ALLP = C.projects; ALLE = api.errors || []; lastGood = NOWMS; MODE = "";
    reconcile(t0 || 0); split();
    $("clock").textContent = C.now.label;
    Object.keys(S.sent).forEach(function (k) { if (!C.waiting.some(function (w) { return w.id === k; })) delete S.sent[k]; });
    var first = !loaded; loaded = true;
    if (was || pidsKey() !== oldKey) {                         /* first load, back from an error, or projects came or went */
      S.landed = null; render(!!was || first || !oldKey, false); if (S.drawer) paintDrawer(false); return;
    }
    if (!projects.length) { renderSummary(); renderBadge(false); renderTable(); return; }
    var nc = colMap(), moved = {};
    Object.keys(nc).forEach(function (k) { if (oldCols[k] && oldCols[k] !== nc[k]) moved[k] = 1; });
    S.landed = moved;                                          /* only tasks that changed column get the landing ring */
    refresh(before, waitingOpen().length > oldOpen);
    if (S.drawer) paintDrawer(false);
    var n = Object.keys(moved).length; if (n) say(n === 1 ? "One task moved" : n + " tasks moved");
  }
  function down() {
    if (MODE === "error") return;
    MODE = "error"; closeDrawerSoft(); render(true);
  }
  function findW(id) { return C.waiting.filter(function (w) { return w.id === id; })[0]; }
  function plainErr(status, msg) {
    msg = String(msg || "");
    var m = /already answered: (.*)$/.exec(msg);
    if (m) return "Already answered: " + m[1] + ".";
    if (status === 403) return /gate/i.test(msg) ? "Gates open only when you type go in the orchestrator tab." : "Conductor only takes answers from its own window. Reopen the app and try again.";
    if (status === 404) return "This question is no longer on the board.";
    if (status === 400) return msg ? cap(msg) + "." : "That answer could not be sent.";
    return msg ? "Not sent: " + msg + "." : "Not sent. Try again.";
  }
  function sendAnswer(id, text) {
    var w = findW(id); if (!w || S.busy[id] || w.rawKind !== "decision") return;
    text = String(text || "").trim();
    if (!text) { S.err[id] = "Write an answer first, or pick one of the options."; paintDrawer(false); return; }
    S.busy[id] = true; delete S.err[id]; paintDrawer(false);
    function done() { if (S.drawer && S.drawer.k === "tray") paintDrawer(false); }
    fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: w.project, id: w.rid, answer: text }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, ok: r.ok && !!j.ok, j: j }; }); })
      .then(function (res) {
        delete S.busy[id];
        if (!res.ok) { S.err[id] = plainErr(res.status, res.j && res.j.error); done(); return; }
        S.sent[id] = text; refresh(null, false); done();
        var el = drawerEl.querySelector('[data-wid="' + id + '"]'); if (el) el.focus({ preventScroll: true });
        say("Sent to " + orchName(proj(w.project)));
        poll();
      })
      .catch(function () { delete S.busy[id]; S.err[id] = "Could not reach Conductor's server, so nothing was sent. Try again."; done(); });
  }
  document.addEventListener("visibilitychange", function () { if (!LIVE) return; if (document.hidden) { clearTimeout(timer); timer = null; } else poll(); });

  /* ---------- go ---------- */
  if (LIVE) {
    document.querySelector(".demo").hidden = true;             /* Move one task, Reset and N are demo-only */
    render(true); poll();
  } else {
    $("clock").textContent = C.now.label;
    render(true);
  }
}
</script>
</body>
