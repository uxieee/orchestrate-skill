name: smoke
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: End-to-end smoke test
        run: python tests/smoke.py
      - name: Git Bash, the way Claude Code on Windows runs the skill
        if: runner.os == 'Windows'
        shell: bash
        run: tests/gitbash_smoke.sh
